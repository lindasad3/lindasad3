name: Contribution snake

on:
  schedule:
    - cron: "43 4 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#4f46e5&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#4f46e5
            dist/snake-dark.svg?palette=github-dark&color_snake=#e879f9&color_dots=#161b22,#312e81,#4338ca,#6366f1,#a5b4fc

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
